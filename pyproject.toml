[project]
name = "gedcom"
version = "0.0.0"
description = "A GEDCOM 7.0.18 writer for Python."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Ali Karbassi" }]
keywords = ["gedcom", "genealogy", "familysearch", "writer", "serializer"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Sociology :: Genealogy",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# YAML input for the CLI. JSON and TOML work with the stdlib alone.
yaml = ["pyyaml>=6"]

[project.scripts]
gedcom = "gedcom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gedcom"]

[tool.uv]
# mise provides the interpreters; never let uv download its own.
python-preference = "only-system"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6", "pyyaml>=6", "types-pyyaml>=6", "coverage[toml]>=7"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Reference-data tables of authoring-dialect field descriptions; long lines
# keep each entry on one readable row.
"src/gedcom/cli/schema.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["gedcom"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
